<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Extractor — Acesso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --gold-dim: rgba(201,168,76,0.15);
      --dark: #0A0A0A;
      --dark2: #111111;
      --dark3: #1A1A1A;
      --border: rgba(201,168,76,0.2);
      --text: #F0EBE0;
      --muted: #5A5550;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* Grade de fundo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Glow central */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--dark2);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0;
      animation: fadeUp 0.5s ease both;
      box-shadow: 0 0 80px rgba(201,168,76,0.05), 0 24px 48px rgba(0,0,0,0.6);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--gold-dim);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 22px;
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .divider-line {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2rem;
    }

    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      background: var(--dark3);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      margin-bottom: 1.5rem;
    }

    input[type="email"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    input[type="email"]::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
    }

    .btn:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,168,76,0.25); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg {
      margin-top: 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      line-height: 1.6;
    }
    .msg.ok { color: #5CB85C; }
    .msg.err { color: #E55; }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">

    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <div class="logo-title">LEAD EXTRACTOR</div>
      <div class="logo-sub">Sistema de Prospecção · Consórcio</div>
    </div>

    <div class="divider-line"></div>

    <div class="field-label">Seu e-mail de acesso</div>
    <input type="email" id="email" placeholder="seuemail@exemplo.com" />

    <button class="btn" id="btn" onclick="entrar()">ENVIAR LINK DE ACESSO</button>

    <p class="msg" id="msg"></p>

    <div class="footer">Acesso exclusivo para assinantes ativos</div>

  </div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://xbhgwgovhgydiypsehjy.supabase.co',
    'sb_publishable_Ic3Yu71wCn8zbHFHeiBSCw_vLfGaYey'
  );

  // Se já tem sessão ativa, manda pro dashboard
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = '/dashboard.html';
  })();

  async function entrar() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const btn   = document.getElementById('btn');
    const msg   = document.getElementById('msg');

    if (!email || !email.includes('@')) {
      msg.className = 'msg err';
      msg.innerText = 'Digite um e-mail válido.';
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Verificando...';
    msg.className = 'msg';
    msg.innerText = '';

    // Verifica se e-mail está na base de ativos
    try {
      const res = await fetch('/api/verificar-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (!data.ativo) {
        msg.className = 'msg err';
        msg.innerText = 'E-mail não encontrado ou assinatura inativa.\nVerifique sua assinatura na Hotmart.';
        btn.disabled = false;
        btn.innerText = 'ENVIAR LINK DE ACESSO';
        return;
      }
    } catch(e) {
      msg.className = 'msg err';
      msg.innerText = 'Erro ao verificar. Tente novamente.';
      btn.disabled = false;
      btn.innerText = 'ENVIAR LINK DE ACESSO';
      return;
    }

    // Envia magic link
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin + '/dashboard.html'
      }
    });

    if (error) {
      msg.className = 'msg err';
      msg.innerText = 'Erro ao enviar link. Tente novamente.';
    } else {
      msg.className = 'msg ok';
      msg.innerText = '✓ Link enviado! Verifique sua caixa de entrada\n(e o spam, por precaução).';
    }

    btn.disabled = false;
    btn.innerText = 'ENVIAR LINK DE ACESSO';
  }

  // Enter para enviar
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') entrar();
  });
</script>
</body>
</html>
